name: DCOR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Tests
        run: pytest --cov=dcor --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dcor-coverage
          path: coverage.xml
          if-no-files-found: ignore

  sprint-gate:
    name: Sprint delivery gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate delivery monitor
        run: |
          test -s README.md
          test -s ARCHITECTURE.md
          test -s STANDARDS.md
          test -s BACKLOG.md
          test -s docs/CANONICAL_DATA_MODEL.md
          test -s docs/REUSE_MATRIX.md
          grep -q 'S0' README.md
          grep -q 'S11' README.md
          grep -q 'Connector SDK' BACKLOG.md
          echo 'DCOR sprint gate: PASS'
