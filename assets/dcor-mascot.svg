<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Otto, DCOR engineering mascot</title>
  <desc id="desc">Technical otter with a telemetry HUD and control tablet, representing observe, measure, simulate, optimize and verify for data-center efficiency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0a6f78"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d70"/>
      <stop offset="1" stop-color="#0b213f"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#20d8e8" stroke-width="7" opacity=".65"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#20d8e8" stroke-width="1" stroke-dasharray="4 11" opacity=".4"/>

  <!-- water / cooling flow -->
  <path d="M108 360c31-19 43-48 48-83" fill="none" stroke="#20d8e8" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="M98 374c25-8 43-4 60 13" fill="none" stroke="#67f4ff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <circle cx="103" cy="378" r="5" fill="#67f4ff" opacity=".8"/>

  <!-- otter head -->
  <path d="M183 187c-13-35 7-71 43-77 36-7 88-3 111 19 26 25 30 67 9 99l-13 21H194z" fill="#805747" stroke="#3d2a25" stroke-width="9"/>
  <ellipse cx="221" cy="174" rx="42" ry="48" fill="#a8755e"/>
  <ellipse cx="294" cy="174" rx="42" ry="48" fill="#a8755e"/>
  <ellipse cx="256" cy="222" rx="83" ry="73" fill="#9a6855" stroke="#3d2a25" stroke-width="7"/>
  <ellipse cx="256" cy="237" rx="48" ry="35" fill="#d49b7e"/>
  <ellipse cx="226" cy="208" rx="10" ry="13" fill="#07131f"/>
  <ellipse cx="286" cy="208" rx="10" ry="13" fill="#07131f"/>
  <circle cx="229" cy="204" r="3" fill="white"/>
  <circle cx="289" cy="204" r="3" fill="white"/>
  <ellipse cx="256" cy="227" rx="17" ry="12" fill="#35231f"/>
  <path d="M229 249c17 19 37 19 54 0" fill="none" stroke="#35231f" stroke-width="7" stroke-linecap="round"/>

  <!-- technical HUD -->
  <path d="M176 165c19-45 141-49 165 3l-9 27H185z" fill="#0b1729" stroke="#20d8e8" stroke-width="8"/>
  <path d="M204 160h104" stroke="#67f4ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M216 178h26M273 178h45" stroke="#20d8e8" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M222 188c20-8 45-8 68 0" fill="none" stroke="#67f4ff" stroke-width="3" opacity=".7"/>
  <text x="330" y="155" fill="#67f4ff" font-family="monospace" font-size="11">PUE</text>
  <text x="330" y="169" fill="#67f4ff" font-family="monospace" font-size="11">TEMP</text>
  <text x="330" y="183" fill="#67f4ff" font-family="monospace" font-size="11">FLOW</text>

  <!-- technical suit -->
  <path d="M182 292c-9 31-5 83 21 112 34 38 72 49 112 44 42-5 75-30 82-73 4-25 0-55-11-83-42 19-158 20-204 0z" fill="url(#suit)" stroke="#061629" stroke-width="9"/>
  <path d="M256 315l-15 30h18l-11 32 36-43h-20l15-19z" fill="#36e5f2"/>
  <path d="M206 324h44M206 340h28" stroke="#67f4ff" stroke-width="4" stroke-linecap="round" opacity=".65"/>

  <!-- tablet: canonical product flow -->
  <rect x="316" y="304" width="104" height="136" rx="16" transform="rotate(-9 316 304)" fill="#102f52" stroke="#20d8e8" stroke-width="7"/>
  <rect x="330" y="318" width="76" height="106" rx="8" transform="rotate(-9 330 318)" fill="#061a31"/>
  <text x="342" y="337" fill="#67f4ff" font-family="monospace" font-size="8" transform="rotate(-9 342 337)">DCOR FLOW</text>
  <path d="M343 352h51M343 366h44M343 380h51M343 394h38" stroke="#20d8e8" stroke-width="4" stroke-linecap="round" opacity=".8" transform="rotate(-9 343 352)"/>
  <path d="M365 407l-8-13 11 3 4-12 5 18z" fill="#ffd447"/>

  <!-- arm / device interaction -->
  <path d="M169 317c-25 4-38 25-31 43 6 17 28 23 48 13" fill="#805747" stroke="#3d2a25" stroke-width="8"/>
  <path d="M338 454c14-14 30-16 45-7" fill="none" stroke="#20d8e8" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- engineering status marks -->
  <circle cx="112" cy="116" r="7" fill="#20d8e8"/>
  <path d="M112 94v12M112 126v12M90 116h12M122 116h12" stroke="#20d8e8" stroke-width="3" opacity=".7"/>
  <text x="73" y="458" fill="#67f4ff" font-family="monospace" font-size="12" letter-spacing="2">OBSERVE · OPTIMIZE · VERIFY</text>
</svg>
